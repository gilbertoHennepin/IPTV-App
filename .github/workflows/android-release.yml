name: Android Release APK

# ── Trigger ───────────────────────────────────────────────────────────────
# Runs when a version tag is pushed (e.g. v1.0.0, v2.3.1-beta)
on:
  push:
    tags:
      - 'v*'

# ── Permissions ───────────────────────────────────────────────────────────
permissions:
  contents: write  # Required for creating GitHub Releases and uploading assets

jobs:
  build-and-release:
    name: Build Release APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 Setup ────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ── 3. Decode Keystore from Secrets ─────────────────────────────────
      # The signing keystore is stored as a base64-encoded GitHub Secret
      # (KEYSTORE_BASE64). This step decodes it into a .jks file that
      # Gradle can reference during assembleRelease.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/keystore.jks
          echo "Keystore decoded to ${{ github.workspace }}/keystore.jks"

      # ── 4. Grant Gradle Execute Permission ──────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 5. Build Release APK ────────────────────────────────────────────
      # Signing properties are passed via environment variables so they
      # never appear in build.gradle.kts or version control.
      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 6. Locate APK ──────────────────────────────────────────────────
      - name: Find release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      # ── 7. Create GitHub Release & Attach APK ──────────────────────────
      # Uses softprops/action-gh-release to automatically create a release
      # from the tag, generate release notes, and upload the APK as an
      # asset. The APK download URL can then be used as an AFTVnews
      # Downloader shortcode target.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IPTV App ${{ github.ref_name }}"
          body: |
            ## IPTV App ${{ github.ref_name }}

            ### Installation via Downloader (AFTVnews)
            1. Open **Downloader** on your Fire TV / Android TV
            2. Enter the shortcode or paste the APK URL below
            3. Install and launch

            ### Direct Download
            Download `app-release.apk` from the assets below.

            ---
            *Built from commit ${{ github.sha }}*
          generate_release_notes: true
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Cleanup ─────────────────────────────────────────────────────
      - name: Remove decoded keystore
        if: always()
        run: rm -f ${{ github.workspace }}/keystore.jks
